<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				--bg: #131316;
				--card: #1b1b1f;
				--border: #2a2a31;
				--fg: #ededf0;
				--muted: #9a9aa6;
				--primary: #93a8ff;
				--brand: #5a6eea;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				position: relative;
				background: var(--bg);
				color: var(--fg);
				font-family: "Plus Jakarta Sans", system-ui, sans-serif;
			}
			.glow {
				position: absolute;
				inset: 0;
				background:
					radial-gradient(
						640px 420px at 88% 8%,
						rgba(90, 110, 234, 0.35),
						transparent 70%
					),
					radial-gradient(
						520px 360px at 0% 100%,
						rgba(147, 168, 255, 0.12),
						transparent 70%
					);
			}
			.left {
				position: absolute;
				left: 72px;
				top: 64px;
				bottom: 64px;
				width: 540px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 16px;
				font-size: 34px;
				font-weight: 800;
				letter-spacing: -0.03em;
			}
			.mark {
				width: 52px;
				height: 52px;
				border-radius: 15px;
				background: var(--brand);
				display: grid;
				place-items: center;
			}
			h1 {
				font-size: 84px;
				line-height: 1.02;
				font-weight: 800;
				letter-spacing: -0.045em;
			}
			h1 span {
				color: var(--primary);
			}
			.sub {
				margin-top: 26px;
				font-size: 27px;
				line-height: 1.4;
				color: var(--muted);
				font-weight: 500;
			}
			.url {
				font-family: "IBM Plex Mono", monospace;
				font-size: 24px;
				color: var(--muted);
			}
			.ui {
				position: absolute;
				left: 636px;
				top: 92px;
				width: 520px;
				height: 446px;
				border-radius: 22px;
				border: 1px solid var(--border);
				background: var(--card);
				box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
				overflow: hidden;
			}
			.bar {
				height: 46px;
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 0 18px;
			}
			.dot {
				width: 11px;
				height: 11px;
				border-radius: 50%;
				background: #3a3a44;
			}
			.body {
				display: flex;
				height: calc(100% - 46px);
			}
			.editor {
				width: 44%;
				padding: 22px 20px;
				border-right: 1px solid var(--border);
				font-family: "IBM Plex Mono", monospace;
				font-size: 17px;
				line-height: 1.7;
				color: var(--muted);
			}
			.editor .h {
				color: var(--primary);
			}
			.editor .k {
				color: var(--fg);
			}
			.stage {
				flex: 1;
				padding: 22px;
				display: flex;
				flex-direction: column;
				gap: 14px;
				justify-content: center;
			}
			.slide {
				border-radius: 12px;
				background: #f4f4f6;
				color: #1b1b1f;
				padding: 22px 24px;
				aspect-ratio: 16 / 9;
				display: flex;
				flex-direction: column;
				justify-content: center;
				gap: 10px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
			}
			.slide .t {
				font-weight: 800;
				font-size: 25px;
				letter-spacing: -0.03em;
				line-height: 1.1;
			}
			.slide .l {
				height: 8px;
				border-radius: 4px;
				background: #d9dcef;
			}
			.slide .l.a {
				background: var(--brand);
				width: 38%;
			}
			.thumbs {
				display: flex;
				gap: 10px;
			}
			.thumb {
				flex: 1;
				aspect-ratio: 16 / 9;
				border-radius: 7px;
				background: #26262d;
				border: 1px solid var(--border);
			}
			.thumb.on {
				border-color: var(--primary);
			}
		</style>
	</head>
	<body>
		<div class="glow"></div>

		<div class="left">
			<div class="brand">
				<div class="mark">
					<svg
						width="30"
						height="30"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#fff"
						stroke-width="2.4"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path d="M2 3h20" />
						<path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3" />
						<path d="m7 21 5-5 5 5" />
					</svg>
				</div>
				slidown
			</div>

			<div>
				<h1>Markdown in.<br /><span>Slides out.</span></h1>
				<p class="sub">
					Write it or generate it with AI. Pick a theme, skip the formatting.
				</p>
			</div>

			<div class="url">slidown.dev</div>
		</div>

		<div class="ui">
			<div class="bar">
				<span class="dot"></span><span class="dot"></span
				><span class="dot"></span>
			</div>
			<div class="body">
				<div class="editor">
					<div class="h"># Launch plan</div>
					<div>&nbsp;</div>
					<div class="k">- Ship v1</div>
					<div class="k">- Collect feedback</div>
					<div>&nbsp;</div>
					<div class="h">---</div>
					<div class="h">## Why now</div>
				</div>
				<div class="stage">
					<div class="slide">
						<div class="t">Launch plan</div>
						<div class="l a"></div>
						<div class="l" style="width: 82%"></div>
						<div class="l" style="width: 64%"></div>
					</div>
					<div class="thumbs">
						<div class="thumb on"></div>
						<div class="thumb"></div>
						<div class="thumb"></div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
